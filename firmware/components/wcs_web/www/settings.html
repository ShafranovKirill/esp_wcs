<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESP WCS — настройки</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main class="card">
    <header class="row">
      <h1>Настройки</h1>
      <form method="post" action="/logout">
        <button type="submit" class="secondary">Выйти</button>
      </form>
    </header>

    <section>
      <h2>Устройство</h2>
      <dl id="status">
        <dt>Прошивка</dt><dd data-key="firmware">…</dd>
        <dt>ESP-IDF</dt><dd data-key="idf">…</dd>
        <dt>MAC</dt><dd data-key="mac">…</dd>
        <dt>Время работы</dt><dd data-key="uptime">…</dd>
        <dt>Свободно RAM / PSRAM</dt><dd data-key="heap">…</dd>
      </dl>
    </section>

    <section>
      <h2>Параметры</h2>
      <p class="muted">Настройки появятся в следующих версиях.</p>
    </section>
  </main>
  <script src="/assets/settings.js"></script>
</body>
</html>

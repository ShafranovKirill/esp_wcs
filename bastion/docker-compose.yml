services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${BASTION_DB_USER:-bastion}
      POSTGRES_PASSWORD: ${BASTION_DB_PASSWORD:-bastion}
      POSTGRES_DB: bastion_dev
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  bastion:
    profiles: [server]
    build: .
    restart: unless-stopped
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      BASTION_DATA_DIR: /app/data
    volumes:
      - bastion_data:/app/data
    command: ["sh", "-c", "/app/bin/migrate && exec /app/bin/server"]

volumes:
  db_data:
  bastion_data:

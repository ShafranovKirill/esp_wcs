services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${BASTION_DB_USER:-bastion}
      POSTGRES_PASSWORD: ${BASTION_DB_PASSWORD:-bastion}
      POSTGRES_DB: bastion_dev
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    restart: unless-stopped
    entrypoint:
      - sh
      - -ec
      - |
        mkdir -p /etc/seaweedfs
        cat > /etc/seaweedfs/s3.json <<JSON
        {"identities":[{"name":"bastion","credentials":[{"accessKey":"$$S3_ACCESS_KEY","secretKey":"$$S3_SECRET_KEY"}],"actions":["Admin","Read","List","Tagging","Write"]}]}
        JSON
        exec weed server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -dir=/data -volume.max=16 -master.volumeSizeLimitMB=256
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-bastion-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-bastion-local-development-only}
    ports:
      - "127.0.0.1:${S3_PORT:-18333}:8333"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status | grep -q '\"IsLeader\":true' && nc -z 127.0.0.1 8333"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  bastion:
    profiles: [server]
    build: .
    restart: unless-stopped
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy
    env_file: .env
    environment:
      BASTION_DATA_DIR: /app/data
    volumes:
      - bastion_data:/app/data
    command: ["sh", "-c", "/app/bin/migrate && exec /app/bin/server"]

volumes:
  db_data:
  bastion_data:
  s3_data:
